name: Daily Pin Generation

on:
  schedule:
    # Roz raat 2 AM UTC (Pakistan time subah 7 AM ke kareeb) chalega
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # Manual "Run workflow" button se bhi chala sakte ho

permissions:
  contents: write   # images ko repo mein commit/push karne ke liye zaroori hai

jobs:
  generate-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main_daily.py

      - name: Commit generated pin images back to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output_images/ || true
          git commit -m "Daily pipeline: new pin images $(date +'%Y-%m-%d')" || echo "No new images to commit"
          git push origin HEAD:main
